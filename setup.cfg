[metadata]
name = StemKratos
version = attr: StemKratos.__version__
author = attr: StemKratos.__author__
description = KratosMultiphysics for STEM
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    License :: OSI Approved :: BSD License
    Operating System :: Microsoft :: Windows
    Operating System :: Unix
[options]
packages =
    StemKratos

install_requires =
    numpy
    orjson>=3.11.0
    stemkratosmultiphysics==10.4.0.4
    stemkratoslinearsolversapplication==10.4.0.4
    stemkratosstructuralmechanicsapplication==10.4.0.4
    stemkratosgeomechanicsapplication==10.4.0.4
    stemkratosrailwayapplication==10.4.0.4

python_requires = >=3.12, <3.15
