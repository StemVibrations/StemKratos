[metadata]
name = StemKratos
version = attr: StemKratos.__version__
author = attr: StemKratos.__author__
description = KratosMultiphysics for STEM
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: BSD License
    Operating System :: Microsoft :: Windows
    Operating System :: Unix
[options]
packages =
    StemKratos

install_requires =
    numpy
    orjson>=3.11.0
    stemkratosmultiphysics==10.4.0.3
    stemkratoslinearsolversapplication==10.4.0.3
    stemkratosstructuralmechanicsapplication==10.4.0.3
    stemkratosgeomechanicsapplication==10.4.0.3
    stemkratosrailwayapplication==10.4.0.3

python_requires = >=3.10, <3.13
